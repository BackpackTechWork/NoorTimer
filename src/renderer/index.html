<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>NoorTime</title>
        <link rel="stylesheet" href="./styles.css" />
    </head>
    <body>
        <main class="app-shell">
            <section class="hero">
                <div>
                    <p class="eyebrow">Next</p>
                    <h1 id="nextLabel">Loading</h1>
                    <p id="nextTime" class="next-time">--:--</p>
                </div>
                <div class="orb" id="nextIcon"></div>
            </section>

            <section class="countdown-band">
                <span id="countdownLabel" class="countdown-label"
                    >Next prayer in</span
                >
                <strong id="countdown">Preparing timer</strong>
            </section>

            <details class="settings-panel">
                <summary>
                    <span>
                        <strong>Settings</strong>
                        <small id="settingsSummary"
                            >Kuala Lumpur, Malaysia</small
                        >
                    </span>
                    <span class="chevron" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <path d="m6 9 6 6 6-6" />
                        </svg>
                    </span>
                </summary>

                <section class="settings">
                    <label>
                        <span>Country</span>
                        <select id="country">
                            <option>Malaysia</option>
                            <option>United States</option>
                            <option>United Kingdom</option>
                            <option>Saudi Arabia</option>
                            <option>Indonesia</option>
                            <option>Pakistan</option>
                            <option>Turkey</option>
                            <option>United Arab Emirates</option>
                        </select>
                    </label>
                    <label>
                        <span>City</span>
                        <input id="city" autocomplete="off" />
                    </label>
                    <label>
                        <span>Timezone</span>
                        <select id="timezone">
                            <option>Asia/Kuala_Lumpur</option>
                            <option>America/New_York</option>
                            <option>America/Chicago</option>
                            <option>America/Denver</option>
                            <option>America/Los_Angeles</option>
                            <option>Europe/London</option>
                            <option>Asia/Riyadh</option>
                            <option>Asia/Jakarta</option>
                            <option>Asia/Karachi</option>
                            <option>Europe/Istanbul</option>
                            <option>Asia/Dubai</option>
                        </select>
                    </label>
                    <label>
                        <span>Method</span>
                        <select id="method">
                            <option value="3">Muslim World League</option>
                            <option value="2">ISNA</option>
                            <option value="1">Karachi</option>
                            <option value="4">Umm Al-Qura</option>
                            <option value="8">Gulf Region</option>
                            <option value="9">Kuwait</option>
                            <option value="12">Moonsighting Committee</option>
                        </select>
                    </label>
                </section>

                <section class="toolbar">
                    <label class="toggle">
                        <input id="notificationsEnabled" type="checkbox" />
                        <span>Notifications</span>
                    </label>
                    <label class="toggle">
                        <input id="soundEnabled" type="checkbox" />
                        <span>Sound</span>
                    </label>
                    <label class="lead">
                        <span>Alert</span>
                        <input
                            id="alertLeadMinutes"
                            min="1"
                            max="60"
                            type="number"
                        />
                        <span>min</span>
                    </label>
                    <button id="testSound" type="button">Test</button>
                </section>
            </details>

            <section class="today-panel">
                <header>
                    <div>
                        <p class="eyebrow">Today</p>
                        <h2 id="todayTitle">Bismillah, start your day steady.</h2>
                    </div>
                    <strong id="todayProgress">0/5</strong>
                </header>
                <div class="today-progress-track" aria-hidden="true">
                    <span id="todayProgressFill"></span>
                </div>
                <p id="todayMessage" class="today-message">
                    Mark each prayer when it is done.
                </p>
            </section>

            <section class="timeline" id="timeline"></section>
            <section
                class="timeline-skeleton"
                id="timelineSkeleton"
                aria-hidden="true"
            >
                <article class="event skeleton-event">
                    <div class="skeleton skeleton-icon"></div>
                    <div class="skeleton-copy">
                        <span class="skeleton skeleton-title"></span>
                        <span class="skeleton skeleton-subtitle"></span>
                    </div>
                    <span class="skeleton skeleton-time"></span>
                </article>
                <article class="event skeleton-event">
                    <div class="skeleton skeleton-icon"></div>
                    <div class="skeleton-copy">
                        <span class="skeleton skeleton-title"></span>
                        <span class="skeleton skeleton-subtitle"></span>
                    </div>
                    <span class="skeleton skeleton-time"></span>
                </article>
                <article class="event skeleton-event">
                    <div class="skeleton skeleton-icon"></div>
                    <div class="skeleton-copy">
                        <span class="skeleton skeleton-title"></span>
                        <span class="skeleton skeleton-subtitle"></span>
                    </div>
                    <span class="skeleton skeleton-time"></span>
                </article>
                <article class="event skeleton-event">
                    <div class="skeleton skeleton-icon"></div>
                    <div class="skeleton-copy">
                        <span class="skeleton skeleton-title"></span>
                        <span class="skeleton skeleton-subtitle"></span>
                    </div>
                    <span class="skeleton skeleton-time"></span>
                </article>
                <article class="event skeleton-event">
                    <div class="skeleton skeleton-icon"></div>
                    <div class="skeleton-copy">
                        <span class="skeleton skeleton-title"></span>
                        <span class="skeleton skeleton-subtitle"></span>
                    </div>
                    <span class="skeleton skeleton-time"></span>
                </article>
            </section>

            <footer>
                <span id="status">Not updated yet</span>
                <div class="footer-actions">
                    <button
                        id="refreshButton"
                        class="icon-text-button"
                        title="Refresh timings"
                        type="button"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M21 12a9 9 0 0 1-9 9 8.7 8.7 0 0 1-6-2.3" />
                            <path d="M3 12a9 9 0 0 1 15-6.7" />
                            <path d="M18 2v4h-4" />
                            <path d="M6 22v-4h4" />
                        </svg>
                        <span>Refresh</span>
                    </button>
                    <button
                        id="quitButton"
                        class="icon-text-button quit-action"
                        title="Quit app"
                        type="button"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                            <path d="M16 17l5-5-5-5" />
                            <path d="M21 12H9" />
                        </svg>
                        <span>Quit</span>
                    </button>
                </div>
            </footer>

            <section class="api-section">
                <button id="apiLink" type="button">Prayer Times API</button>
            </section>
        </main>
        <script src="./renderer.js"></script>
    </body>
</html>
